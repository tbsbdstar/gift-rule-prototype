<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>日本地址管理 · 丸噗噜小程序</title>
<style>
:root{--bg:#E9EBF0;--card:#fff;--line:#EEEFF3;--t1:#1A1A26;--t2:#8A8A9A;--t3:#B4B4C2;--red:#F5483B;--jp:#D7373F;--green:#2AC97E;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans SC','Hiragino Sans','Yu Gothic',sans-serif;background:var(--bg);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px}
.phone{width:390px;background:#000;border-radius:46px;padding:12px;box-shadow:0 30px 80px rgba(30,30,60,.28)}
.screen{background:var(--bg);border-radius:36px;overflow:hidden;height:822px;display:flex;flex-direction:column;position:relative}
.statusbar{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:14px;font-weight:600;color:var(--t1);flex-shrink:0}
.statusbar .r{display:flex;gap:6px;font-size:12px}
.navbar{height:48px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.navbar .back{position:absolute;left:18px;font-size:26px;color:var(--t1);cursor:pointer;line-height:1}
.navbar .title{font-size:17px;font-weight:600;color:var(--t1)}
.scroll{flex:1;overflow-y:auto;padding:12px 14px 96px}
.scroll::-webkit-scrollbar{width:0}

.card{background:var(--card);border-radius:14px;margin-bottom:12px;padding:16px;position:relative}
.badge{display:inline-block;background:var(--jp);color:#fff;font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}
.frow{display:flex;font-size:14px;line-height:1.7;margin-bottom:2px}
.frow .k{width:72px;flex-shrink:0;color:var(--t3);font-size:13px}
.frow .v{flex:1;color:var(--t1);word-break:break-all}
.frow.name .v{font-size:16px;font-weight:600}
.hr{height:1px;background:var(--line);margin:12px 0 10px}
.ops{display:flex;align-items:center;gap:18px}
.op{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--t2);cursor:pointer}
.op.set .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--t3);display:inline-block}
.op.set.on{color:var(--jp)}
.op.set.on .dot{border-color:var(--jp);background:radial-gradient(circle,#fff 3px,var(--jp) 4px)}
.op.grow{margin-left:auto}
.op .ic{font-size:15px}
.op.del{color:#C0392B}

.empty{text-align:center;color:var(--t3);font-size:14px;padding:80px 0}
.empty .ic{font-size:44px;margin-bottom:10px}

.footer{position:absolute;bottom:0;left:0;right:0;padding:12px 16px 20px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
.add-btn{width:100%;height:48px;border:none;border-radius:24px;background:linear-gradient(135deg,var(--jp),#b3282f);color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 6px 18px rgba(215,55,63,.32);display:flex;align-items:center;justify-content:center;gap:6px}
.add-btn:active{opacity:.85}
</style>

<div class="phone"><div class="screen">
  <div class="statusbar"><span>9:41</span><span class="r">●●● 📶 🔋</span></div>
  <div class="navbar"><span class="back" onclick="history.back()">‹</span><span class="title">地址管理</span></div>
  <div class="scroll" id="list"></div>
  <div class="footer"><button class="add-btn" onclick="location.href='新增日本收货地址.html'">＋ 新增日本收货地址</button></div>
</div></div>

<script>
var KEY='addr_jp_only', SEED_VER='2';   // 升级样例：改版本号即自动重置一次
function seedData(){ return [
  {id:1,country:'jp',name:'山田 太郎',telCC:'081',tel:'09012345678',zip:'085-0467',pref:'北海道',city:'釧路市',town:'阿寒町阿寒湖温泉（１〜６丁目）',detail:'1-1',bldg:'アカンビル101',def:true},
  {id:2,country:'jp',name:'佐藤 花子',telCC:'081',tel:'08023456789',zip:'150-0002',pref:'東京都',city:'渋谷区',town:'渋谷',detail:'2-3-4',bldg:'渋谷タワー20F',def:false},
  {id:3,country:'jp',name:'鈴木 一郎',telCC:'086',tel:'13800001111',zip:'530-0001',pref:'大阪府',city:'大阪市北区',town:'梅田',detail:'1-2-3',bldg:'',def:false},
  {id:4,country:'jp',name:'高橋 実',telCC:'081',tel:'07034567890',zip:'220-0001',pref:'神奈川県',city:'横浜市西区',town:'北軽井沢',detail:'2-19',bldg:'ヨコハマビル5F',def:false},
  {id:5,country:'jp',name:'田中 美咲',telCC:'081',tel:'08099998888',zip:'100-0001',pref:'東京都',city:'千代田区',town:'千代田',detail:'1-1',bldg:'パレスビル8F',def:false},
  {id:6,country:'jp',name:'伊藤 健',telCC:'086',tel:'13566667777',zip:'064-0821',pref:'北海道',city:'札幌市中央区',town:'北一条西（２０〜２８丁目）',detail:'3',bldg:'札幌センター',def:false},
  {id:7,country:'jp',name:'渡辺 由美',telCC:'081',tel:'07011112222',zip:'812-0885',pref:'福岡県',city:'福岡市博多区',town:'相生町',detail:'5-1',bldg:'',def:false},
  {id:8,country:'jp',name:'中村 大輔',telCC:'081',tel:'09033334444',zip:'460-0008',pref:'愛知県',city:'名古屋市中区',town:'栄',detail:'3-5-1',bldg:'サカエビル12F',def:false}
]; }
function load(){
  var s=localStorage.getItem(KEY);
  if(!s || localStorage.getItem(KEY+'_ver')!==SEED_VER){   // 首次或样例升级 → 注入样例
    var seed=seedData();
    localStorage.setItem(KEY,JSON.stringify(seed));
    localStorage.setItem(KEY+'_ver',SEED_VER);
    return seed;
  }
  try{ return JSON.parse(s)||[]; }catch(e){ return []; }
}
function save(a){ localStorage.setItem(KEY,JSON.stringify(a)); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function addrLine(a){ return esc((a.pref||'')+(a.city||'')+(a.town||'')+(a.detail||'')+(a.bldg?(' '+a.bldg):'')); }

function render(){
  var list=load(), box=document.getElementById('list');
  if(!list.length){ box.innerHTML='<div class="empty"><div class="ic">📭</div>还没有收货地址<br>点击下方按钮新增</div>'; return; }
  box.innerHTML=list.map(function(a){
    return '<div class="card">'
      +'<div class="frow name"><span class="k">受取人</span><span class="v">'+esc(a.name)+(a.def?'<span class="badge">默认</span>':'')+'</span></div>'
      +'<div class="frow"><span class="k">電話番号</span><span class="v">'+esc(a.telCC?(a.telCC+' '):'')+esc(a.tel)+'</span></div>'
      +'<div class="frow"><span class="k">郵便番号</span><span class="v">'+(a.zip?'〒'+esc(a.zip):'—')+'</span></div>'
      +'<div class="frow"><span class="k">住所</span><span class="v">'+addrLine(a)+'</span></div>'
      +'<div class="hr"></div>'
      +'<div class="ops">'
        +'<span class="op set'+(a.def?' on':'')+'" onclick="setDefault('+a.id+')"><span class="dot"></span>'+(a.def?'默认地址':'设为默认')+'</span>'
        +'<span class="op grow" onclick="edit('+a.id+')"><span class="ic">✎</span>编辑</span>'
        +'<span class="op del" onclick="del('+a.id+')"><span class="ic">🗑</span>删除</span>'
      +'</div></div>';
  }).join('');
}
function setDefault(id){ var l=load(); l.forEach(function(x){x.def=(x.id===id);}); save(l); render(); }
function del(id){ if(!confirm('确定删除该地址？')) return; save(load().filter(function(x){return x.id!==id;})); render(); }
function edit(id){ location.href='新增日本收货地址.html?edit='+id; }
render();
</script>
